<title>Dos Banderas VR</title>

<style>
/* Escena 3D a pantalla completa; interfaz mínima flotando encima, estilo cinemático (un solo tema oscuro, deliberado) */
:root{
  --ink:#070d0b;
  --panel:rgba(9,18,14,.74);
  --line:rgba(214,232,221,.18);
  --text:#eef3ee;
  --muted:#a6b7ac;
  --brand:#1E6B4F;
  --brand-hi:#4fbf8f;
  --sun:#f2a65a;
  --f-display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--f-body);overflow:hidden}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:#000}
#frame{position:relative;width:100%;height:100%;overflow:hidden;background:var(--ink)}
#stage.vertical #frame{width:auto;height:100%;aspect-ratio:9/16;max-width:100%}
#c{display:block;width:100%;height:100%;touch-action:none}

.top{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:68px;height:auto;background:#fff;border-radius:10px;padding:5px;box-shadow:0 2px 12px rgba(0,0,0,.35)}
.brand span{font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.24em;color:var(--text);text-transform:uppercase;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.badge{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 10px;background:var(--panel);white-space:nowrap}

.bottom{position:absolute;left:16px;right:16px;bottom:16px;display:flex;flex-direction:column;gap:14px;pointer-events:none}
.caption{max-width:760px;transition:opacity .6s ease,transform .6s ease}
.caption.out{opacity:0;transform:translateY(8px)}
.eyebrow{font-weight:700;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--sun);font-variant-numeric:tabular-nums;min-height:1em}
.line{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,4.4vw,54px);line-height:1.04;text-wrap:balance;max-width:20ch;text-shadow:0 2px 24px rgba(0,0,0,.55)}

.chips{display:flex;gap:8px;overflow-x:auto;pointer-events:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:7px 12px;font:600 14px var(--f-body);cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.chip i{width:9px;height:9px;border-radius:50%;flex:none}
.chip b{font-family:var(--f-display);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{border-color:var(--brand-hi);background:rgba(30,107,79,.55)}

.controls{display:flex;flex-direction:column;gap:10px;pointer-events:auto}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--sun)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button.b{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:9px 14px;font:600 14px var(--f-body);cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
button.b:hover{border-color:rgba(214,232,221,.4)}
button.b.vr{background:var(--brand);border-color:var(--brand-hi)}
button:focus-visible{outline:2px solid var(--sun);outline-offset:2px}

#restore{position:absolute;top:10px;right:10px;opacity:0;transition:opacity .3s;pointer-events:auto}
#restore:hover,#restore:focus-visible{opacity:.9}
.rec .chips,.rec .controls,.rec .badge{display:none}

.toast{position:absolute;left:50%;top:84px;transform:translateX(-50%);width:min(92%,520px);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;font-size:15px;line-height:1.4;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.count{position:absolute;inset:0;z-index:5;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:22vmin;color:rgba(238,243,238,.9);pointer-events:none}
.loading{position:absolute;inset:0;pointer-events:none;display:grid;place-items:center;background:var(--ink);font-family:var(--f-display);font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);transition:opacity .8s}
@media (max-width:520px){.btns button.b{padding:8px 11px;font-size:13px}.brand img{width:56px}}
</style>

  // subtítulos
  let eb = '', ln = '';
  if (cine) { const sc = SCENES.find(s => t >= s.a && t < s.b); if (sc) { eb = sc.eb; ln = sc.ln; } }
  else if (sel < 0) { eb = 'Explore la finca'; ln = inVR ? 'Apunte a una vaca y presione el gatillo.' : 'Toque una vaca para ver su ficha.'; }
  setCaption(eb, ln);
  $('#prog').style.width = (cine ? Math.min(100, t / T_END * 100) : 100) + '%';
  if (inVR) {
    drawCapVR(eb, ln); op.cap = approach(op.cap, ln ? 1 : 0, dt, 4); capM.material.opacity = op.cap;
    fwd.set(0, -0.32, -1).normalize().applyQuaternion(headQ); tmpP.copy(headP).addScaledVector(fwd, 2.0);
    capM.position.lerp(tmpP, Math.min(1, dt * 3)); capM.lookAt(headP);
    replayM.visible = !cine; if (replayM.visible) { replayM.position.set(-0.75, 1.0, 6.4); replayM.lookAt(headP); }
  }

  // cámara 2D
  if (!inVR) {
    if (fly) {
      const f = ss(0, 1, (clock.elapsedTime - fly.s) / fly.d);
      camera.position.lerpVectors(fly.p0, fly.p1, f); tmpL.lerpVectors(fly.l0, fly.l1, f); camera.lookAt(tmpL);
      if (f >= 1) { controls.target.copy(fly.l1); fly = null; if (mode === 'explore') controls.enabled = true; }
    } else if (cine) {
      camAt(t, tmpP, tmpL);
      tmpP.x += Math.sin(time * 0.6) * 0.06; tmpP.y += Math.sin(time * 0.9) * 0.04;
      camera.position.copy(tmpP); camera.lookAt(tmpL);
    } else if (controls.enabled) controls.update();
  }
}

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1);
  if (mode === 'cine' && playing) { t += dt; if (t >= T_END) enterExplore(); }
  update(dt, clock.elapsedTime);
  renderer.render(scene, camera);
});
syncUI();
const ld = $('#loading'); ld.style.opacity = 0; setTimeout(() => { ld.hidden = true; ld.remove(); }, 900);
})();
</script>
